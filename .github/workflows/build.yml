name: Build MsenderM Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Signed Release APK
      run: gradle assembleRelease --stacktrace

    - name: Prepare APK Asset
      run: |
        mkdir -p release_out
        cp app/build/outputs/apk/release/*.apk release_out/MsenderM-update.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MsenderM-Release
        path: release_out/MsenderM-update.apk

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.14
        name: "MsenderM Release v1.0.14"
        draft: false
        prerelease: false
        files: release_out/MsenderM-update.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
